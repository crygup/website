<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>crygup · sphere solver</title>
  <link rel="stylesheet" href="style.css?s=13">
  <link rel="stylesheet" href="oc.css?s=1">
  <link rel="icon" type="image/x-icon" href="images/pfp.ico">
</head>
<body data-page="mudae">
  <header>
    <h1>Sphere Solver</h1>
  </header>
  <main>
    <nav class="tab-bar">
      <a href="/oq" class="tab-btn">OQ Solver</a>
    </nav>

    <section class="tab-panel" id="oc-panel">
      <p class="oc-hint">Click cells to mark revealed colors. The <span class="best-indicator">highlighted</span> cell is the recommended next click.</p>

      <div id="oc-grid"></div>
      <p id="oc-status"></p>

      <div id="oc-controls">
        <button id="oc-reset">Reset Grid</button>
        <button id="oc-emoji-toggle">Show Emojis</button>
      </div>

    </section>
  </main>

  <footer>
  <script src="script.js?s=3"></script>
  <script src="oc.js?s=1"></script>

</body>
</html>
