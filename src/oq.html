<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>crygup · oq solver</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="oc.css">
  <link rel="stylesheet" href="oq.css">
  <link rel="icon" type="image/x-icon" href="images/pfp.ico">
</head>
<body data-page="mudae">
  <header>
    <h1>OQ Solver</h1>
  </header>
  <main>
    <nav class="tab-bar">
      <a href="/mudae?tab=oc" class="tab-btn">OC Solver</a>
    </nav>

    <section class="tab-panel" id="oq-panel">
      <p class="oc-hint">Click cells to mark revealed colors. The <span class="best-indicator">highlighted</span> cell is the recommended next click.</p>
      <div id="oq-grid"></div>

      <p id="oq-status"></p>

      <div id="oq-controls">
        <button id="oq-reset">Reset Grid</button>
        <button id="oq-emoji-toggle">Show Emojis</button>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="year"></span></p>
  </footer>

    <script src="session.js"></script>
  <script src="script.js"></script>
  <script src="oq.js"></script>
</html>
