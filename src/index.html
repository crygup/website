<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>crygup</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="images/pfp.ico">
</head>
<body data-page="">
  <header>
    <h1 id="name"></h1>
    <p id="tagline"></p>
  </header>
  <main>
    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="bio">About Me</button>
      <button class="tab-btn" data-tab="projects">Projects</button>
      <button class="tab-btn" data-tab="videos">Videos</button>
    </nav>
    <section class="tab-panel bio-card" id="bio-panel">
      <p id="bio"></p>
      <aside id="activity-sidebar" aria-label="Recent activity">
        <section id="now-playing"></section>
        <section id="steam-playing" class="hidden" aria-label="Steam game activity"></section>
        <section id="anime-playing" class="hidden" aria-label="Recently watched anime"></section>
      </aside>
      <div id="socials"></div>
    </section>
    <section class="tab-panel projects-card hidden" id="projects-panel">
      <ul id="project-list"></ul>
    </section>
    <section class="tab-panel videos-card hidden" id="videos-panel">
      <div id="video-list"></div>
    </section>
  </main>
  <footer>
    <p>&copy; <span id="year"></span></p>
  </footer>
  <script src="session.js"></script>
  <script src="script.js"></script>
</body>
</html>
