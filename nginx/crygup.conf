# Check the TCP peer, not the rewritten visitor address.
geo $realip_remote_addr $fishie_origin_allowed {
    default 0;
    127.0.0.1/32 1;
    ::1/128 1;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# No query strings, bearer paths, referrers, or arbitrary client strings in logs.
map $uri $fishie_log_path {
    ~^/media/ "/media/[redacted]";
    ~^/download-api/jobs/ "/download-api/jobs/[redacted]";
    default $uri;
}
log_format fishie_safe '$remote_addr [$time_local] $request_method $fishie_log_path $status $body_bytes_sent origin_port=$server_port';
limit_req_zone $binary_remote_addr zone=fishie_api:10m rate=10r/s;
map $uri $fishie_login_key {
    ~^/fishie/oauth/ $binary_remote_addr;
    default "";
}
limit_req_zone $fishie_login_key zone=fishie_login:1m rate=10r/m;

# Trust CF-Connecting-IP only when the connection came from Cloudflare.
# Source: https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# crygup.com, served by the loopback-only static website container.
server {
    listen 80;
    server_name crygup.com www.crygup.com api.crygup.com;
    if ($fishie_origin_allowed = 0) { return 403; }
    access_log /var/log/nginx/fishie-access.log fishie_safe;
    error_log /dev/null;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/crygup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crygup.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name crygup.com www.crygup.com;
    if ($fishie_origin_allowed = 0) { return 403; }
    access_log /var/log/nginx/fishie-access.log fishie_safe;
    error_log /dev/null;
    limit_req_status 429;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    location = /backup { deny all; }
    location ^~ /backup/ { deny all; }

    location = /config { deny all; }
    location ^~ /config/ { deny all; }

    location = /server { deny all; }
    location ^~ /server/ { deny all; }

    location = /downloads { deny all; }
    location ^~ /downloads/ { deny all; }

    location ~ /\. {
        deny all;
    }

    location ~ /(serve\.py|requirements\.txt)$ {
        deny all;
    }

    location = /download-api {
        return 404;
    }

    location ^~ /download-api/ {
        limit_req zone=fishie_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8002/;
        proxy_http_version 1.1;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 16k;
    }

    location ~ ^/images/drpepper-80\.(?:gif|png|webp)$ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript;
}

# api.crygup.com, split between Fishie and the avatar API containers.
server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/crygup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crygup.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name api.crygup.com;
    if ($fishie_origin_allowed = 0) { return 403; }
    access_log /var/log/nginx/fishie-access.log fishie_safe;
    error_log /dev/null;
    limit_req_status 429;
    limit_req zone=fishie_api burst=30 nodelay;
    limit_req zone=fishie_login burst=5 nodelay;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    location /fishie/ {
        rewrite ^/fishie/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    location ^~ /media/ {
        proxy_pass http://127.0.0.1:8003/;
        proxy_http_version 1.1;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        client_body_timeout 600s;
        # The normal website download endpoint remains capped in its own
        # application.  The authenticated Fishie temporary-media endpoint can
        # use its owner-only 2 GiB ceiling when explicitly requested.
        client_max_body_size 2g;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
