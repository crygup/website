name: crygup-website

services:
  static:
    build:
      context: .
      dockerfile: Dockerfile
      target: static
    user: "${WEBSITE_UID:?set WEBSITE_UID}:${WEBSITE_GID:?set WEBSITE_GID}"
    environment:
      WEBSITE_LOG_PATH: /app/logs/static.log
      HOME: /tmp
      TZ: Europe/Berlin
    volumes:
      - ./src/logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"

  avatar-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: avatar-api
    user: "${WEBSITE_UID:?set WEBSITE_UID}:${WEBSITE_GID:?set WEBSITE_GID}"
    network_mode: host
    environment:
      WEBSITE_CONFIG_FILE: /run/secrets/avatar.env
      WEBSITE_LOG_PATH: /app/logs/avatar.log
      WEBSITE_API_HOST: 127.0.0.1
      WEBSITE_API_PORT: "8000"
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      TZ: Europe/Berlin
    volumes:
      - ./src/server/config/.env:/run/secrets/avatar.env:ro
      - ./src/logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"

  download-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: download-api
    user: "${WEBSITE_UID:?set WEBSITE_UID}:${WEBSITE_GID:?set WEBSITE_GID}"
    environment:
      WEBSITE_DOWNLOAD_HOST: 0.0.0.0
      WEBSITE_DOWNLOAD_PORT: "8002"
      WEBSITE_DOWNLOAD_PATH: /app/downloads
      WEBSITE_DOWNLOAD_COOKIE_PATH: /app/cookies
      WEBSITE_LOG_PATH: /app/logs/download.log
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      TZ: Europe/Berlin
    volumes:
      - ./src/server/cookies:/app/cookies:ro
      - ./src/downloads:/app/downloads
      - ./src/logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "127.0.0.1:8002:8002"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8002/health/ready', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 15s
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"
