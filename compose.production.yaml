name: crygup-website

services:
  static:
    build:
      context: .
      dockerfile: Dockerfile
      target: static
    user: "${WEBSITE_UID:?set WEBSITE_UID}:${WEBSITE_GID:?set WEBSITE_GID}"
    environment:
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      WEBSITE_LOG_PATH: /app/logs/static.log
      HOME: /tmp
      TZ: Europe/Berlin
    volumes:
      - ./src/logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"

  avatar-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: avatar-api
    user: "${WEBSITE_UID:?set WEBSITE_UID}:${WEBSITE_GID:?set WEBSITE_GID}"
    network_mode: host
    environment:
      WEBSITE_CONFIG_FILE: /run/secrets/avatar.env
      WEBSITE_LOG_PATH: /app/logs/avatar.log
      WEBSITE_API_HOST: 127.0.0.1
      WEBSITE_API_PORT: "8000"
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      TZ: Europe/Berlin
    volumes:
      - ./src/server/config/.env:/run/secrets/avatar.env:ro
      - ./src/logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"

  media-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: media-api
    user: "${WEBSITE_UID:?set WEBSITE_UID}:${WEBSITE_GID:?set WEBSITE_GID}"
    environment:
      WEBSITE_MEDIA_HOST: 0.0.0.0
      WEBSITE_MEDIA_PORT: "8003"
      WEBSITE_MEDIA_PATH: /app/media
      WEBSITE_MEDIA_UPLOAD_TOKEN: ${FISHIE_MEDIA_API_KEY:?set FISHIE_MEDIA_API_KEY}
      WEBSITE_MEDIA_OWNER_UPLOAD_TOKEN: ${FISHIE_MEDIA_OWNER_API_KEY:?set FISHIE_MEDIA_OWNER_API_KEY}
      WEBSITE_MEDIA_PUBLIC_BASE: https://api.crygup.com/media
      WEBSITE_LOG_PATH: /app/logs/media.log
      HOME: /tmp
      TZ: Europe/Berlin
    volumes:
      - ./src/logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "127.0.0.1:8003:8003"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8003/health/ready', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    init: true
    read_only: true
    tmpfs:
      # The media API runs as WEBSITE_UID/GID, so the tmpfs must be writable
      # by that user rather than the default root owner.
      - /app/media:rw,nosuid,nodev,size=3g,uid=${WEBSITE_UID:?set WEBSITE_UID},gid=${WEBSITE_GID:?set WEBSITE_GID},mode=0750
      - /tmp:rw,nosuid,nodev,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 2.0
    stop_grace_period: 15s
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"

  rapi-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: rapi-api
    user: "${WEBSITE_UID:?set WEBSITE_UID}:${WEBSITE_GID:?set WEBSITE_GID}"
    environment:
      WEBSITE_RAPI_HOST: 0.0.0.0
      WEBSITE_RAPI_PORT: "8004"
      WEBSITE_RAPI_KEY: ${RAPI_KEY:?set RAPI_KEY}
      WEBSITE_LOG_PATH: /app/logs/rapi.log
      HOME: /tmp
      TZ: Europe/Berlin
    volumes:
      - ./src/logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "127.0.0.1:8004:8004"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8004/health/ready', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"

  robase-db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: robase
      POSTGRES_USER: robase
      POSTGRES_PASSWORD: ${RODB_DB_PASSWORD:?set RODB_DB_PASSWORD}
    volumes:
      - robase-data:/var/lib/postgresql
    networks:
      - robase-internal
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"

  rodb-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: rodb-api
    user: "${WEBSITE_UID:?set WEBSITE_UID}:${WEBSITE_GID:?set WEBSITE_GID}"
    environment:
      WEBSITE_RODB_HOST: 0.0.0.0
      WEBSITE_RODB_PORT: "8005"
      WEBSITE_RODB_KEY: ${RODB_KEY:?set RODB_KEY}
      WEBSITE_RODB_DB_HOST: robase-db
      WEBSITE_RODB_DB_PORT: "5432"
      WEBSITE_RODB_DB_NAME: robase
      WEBSITE_RODB_DB_USER: robase
      WEBSITE_RODB_DB_PASSWORD: ${RODB_DB_PASSWORD:?set RODB_DB_PASSWORD}
      WEBSITE_LOG_PATH: /app/logs/rodb.log
      HOME: /tmp
      TZ: Europe/Berlin
    volumes:
      - ./src/logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "127.0.0.1:8005:8005"
    networks:
      - default
      - robase-internal
    depends_on:
      robase-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8005/health/ready', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"

networks:
  robase-internal:
    internal: true

volumes:
  robase-data:
