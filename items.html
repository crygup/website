<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>crygup · ror2 items</title>
<link rel="icon" type="image/x-icon" href="images/pfp.ico">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, sans-serif; background: #111; color: #ddd; padding: 2rem; text-align: center; }
h1 { color: #f8fafc; margin-bottom: 0.5rem; }
#count { color: #64748b; font-size: 0.85rem; margin-bottom: 1.5rem; }
.rarity-group { margin-bottom: 2rem; }
.rarity-group h2 { font-size: 1.1rem; color: #e2e8f0; margin-bottom: 0.75rem; padding-bottom: 0.3rem; display: flex; align-items: center; gap: 0.5rem; }
.rarity-group h2 span { font-size: 0.8rem; color: #64748b; font-weight: 400; }
.items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0.75rem; text-align: left; }
select optgroup option { color: #ddd; padding-left: 0.5rem; }
.card { background: #1a1c1f; border-radius: 0.4rem; padding: 0.75rem; cursor: pointer; text-align: left; transition: background 0.15s; display: flex; gap: 0.65rem; align-items: flex-start; }
.card:hover { background: #25282e; }
.card img { width: 48px; height: 48px; object-fit: contain; flex-shrink: 0; border-radius: 0.25rem; }
.card-body { flex: 1; min-width: 0; }
.card-body h3 { font-size: 0.9rem; color: #f8fafc; margin-bottom: 0.15rem; }
.card-body .desc { font-size: 0.8rem; color: #cbd5e1; margin-top: 0.3rem; line-height: 1.35; }
.card-body .meta { font-size: 0.72rem; color: #64748b; margin-top: 0.25rem; }
.card-body .meta b { color: #94a3b8; }

/* modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; justify-content: center; align-items: center; }
.modal-overlay.open { display: flex; }
.modal { background: #1a1c1f; border-radius: 0.5rem; max-width: 560px; width: 90%; max-height: 85vh; overflow-y: auto; padding: 1.25rem; position: relative; text-align: left; }
.modal img { width: 64px; height: 64px; object-fit: contain; float: left; margin-right: 0.75rem; border-radius: 0.3rem; }
.modal h2 { font-size: 1.1rem; color: #f8fafc; margin-bottom: 0.2rem; }
.modal .sub { font-size: 0.8rem; color: #64748b; margin-bottom: 0.75rem; }
.modal .section { margin-top: 0.75rem; }
.modal .section p, .modal .row { padding-left: 0.3rem; }
.modal .section h3 { padding-left: 0.3rem; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.04em; }
.modal .section .content { padding-left: 0.3rem; font-size: 0.83rem; line-height: 1.45; color: #cbd5e1; }
.modal .row + .row { margin-top: 0.25rem; }
.modal .row { font-size: 0.8rem; color: #94a3b8; }
.modal .row b { color: #cbd5e1; }
.modal .close { position: absolute; top: 0.6rem; right: 0.8rem; color: #64748b; cursor: pointer; font-size: 1.2rem; line-height: 1; }
.modal .close:hover { color: #f8fafc; }
</style>
</head>
<body>
<h1>Risk of Rain 2 Items</h1>
<p id="count">Loading…</p>
<input type="search" id="search" placeholder="Search items…" autocomplete="off" style="width:100%;max-width:400px;padding:0.5rem 0.75rem;background:#1a1c1f;border:1px solid #333;border-radius:0.3rem;color:#ddd;font-size:0.9rem;display:block;margin:0 auto 1rem auto">
<div style="display:flex;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap;justify-content:center">
<select id="filterRarity" style="padding:0.4rem 0.6rem;background:#1a1c1f;border:1px solid #333;border-radius:0.3rem;color:#ddd;font-size:0.85rem">
  <option value="">All Rarities</option>
  <option>Common</option><option>Uncommon</option><option>Legendary</option>
  <option>Void</option><option>Boss</option>
  <option>Equipment</option><option>Elite Equipment</option>
  <option>Lunar</option><option>Lunar Equipment</option>
</select>
<select id="filterCategory" style="padding:0.4rem 0.6rem;background:#1a1c1f;border:1px solid #333;border-radius:0.3rem;color:#ddd;font-size:0.85rem;max-width:260px">
  <option value="">All Categories</option>
  <optgroup label="— Main —">
    <option value="Damage">Damage - Damage items</option>
    <option value="Utility">Utility - Utility items</option>
    <option value="Healing">Healing - Healing items</option>
    <option value="OnKillEffect">OnKillEffect - Does something on kill</option>
    <option value="TurretBlacklist">TurretBlacklist - Blacklisted from turrets</option>
    <option value="AIBlacklist">AIBlacklist - Enemies cannot use these</option>
  </optgroup>
  <optgroup label="— Misc —">
    <option value="CannotSteal">CannotSteal - Not stolen by Mithrix</option>
    <option value="BrotherBlacklist">BrotherBlacklist - Mithrix cannot use</option>
    <option value="WorldUnique">WorldUnique - Not in loot pool</option>
    <option value="Scrap">Scrap - Scrapper related</option>
    <option value="SprintRelated">SprintRelated - Sprint-related effects</option>
    <option value="EquipmentRelated">EquipmentRelated - Equipment related</option>
    <option value="LowHealth">LowHealth - Low health effects</option>
    <option value="InteractableRelated">InteractableRelated - Interaction events</option>
    <option value="OnStageBeginEffect">OnStageBeginEffect - Stage start effects</option>
    <option value="HoldoutZoneRelated">HoldoutZoneRelated - Teleporter/charge shrine events</option>
    <option value="CannotDuplicate">CannotDuplicate - Can't appear in 3D Printers</option>
    <option value="DevotionBlacklist">DevotionBlacklist - Can't be given to Devoted Lemurians</option>
    <option value="HalcyoniteShrine">HalcyoniteShrine - Halcyon Shrine drops</option>
    <option value="RebirthBlacklist">RebirthBlacklist - Blacklisted from Artifact of Rebirth</option>
  </optgroup>
</select>
</div>
<div id="content"></div>

<div class="modal-overlay" id="modal"><div class="modal"><span class="close" id="modalClose">✕</span><div id="modalBody"></div></div></div>

<script>
(async () => {
  const res = await fetch("/ror2-data/items.json?t=" + Date.now());
  const data = await res.json();

  const enemiesRes = await fetch("/ror2-data/enemies.json?t=" + Date.now());
  const enemiesData = await enemiesRes.json();
  const enemyMap = {};
  for (const e of enemiesData.enemies) {
    enemyMap[e.internal_name] = e;
  }
  function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  const order = ["Common", "Uncommon", "Legendary", "Void", "Boss", "Equipment", "Elite Equipment", "Lunar", "Lunar Equipment", "Other"];
  const baseRarity = r => r.startsWith("Boss(") ? "Boss" : r.startsWith("Lunar Equipment") ? "Lunar Equipment" : r || "Other";

  const groups = {};
  for (const item of data.items) {
    const r = baseRarity(item.rarity);
    (groups[r] = groups[r] || []).push(item);
  }

  const rarityColor = {
    "Equipment": "#d98830", "Lunar Equipment": "#42dbf3", "Elite Equipment": "#f09f38",
    "Common": "#dadde2", "Uncommon": "#75c440", "Legendary": "#f65a47",
    "Boss": "#c7d724", "Lunar": "#3fd6f3", "Void": "#d785cf", "Other": "#888888",
  };
  const content = document.getElementById("content");
  for (const rarity of order) {
    const items = groups[rarity];
    if (!items || !items.length) continue;
    const color = rarityColor[rarity] || "#888888";
    let html = `<div class="rarity-group"><h2 style="font-size:1.2rem;color:${color};border-bottom:1px solid ${color}">${esc(rarity)} <span>${items.length}</span></h2><div class="items-grid">`;
    for (const item of items) {
      const img = item.internal_name ? `<img src="/images/ror2/items/${item.internal_name}.png" alt="" loading="lazy">` : "";
      html += `<div class="card" data-iname="${esc(item.internal_name)}">${img}<div class="card-body">`;
      html += `<h3>${esc(item.name)}</h3>`;
      if (item.desc_short) html += `<div class="desc">${esc(item.desc_short)}</div>`;
      html += `</div></div>`;
    }
    html += `</div></div>`;
    content.innerHTML += html;
  }

  // modal open
  content.addEventListener("click", e => {
    const card = e.target.closest(".card");
    if (!card) return;
    const iname = card.dataset.iname;
    const item = data.items.find(i => i.internal_name === iname);
    if (!item) return;
    showModal(item);
  });

  // modal close
  document.getElementById("modalClose").onclick = () => document.getElementById("modal").classList.remove("open");
  document.getElementById("modal").onclick = e => { if (e.target === e.currentTarget) e.currentTarget.classList.remove("open"); };
  document.addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("modal").classList.remove("open"); });

  // live search filter
  document.getElementById("search").addEventListener("input", applyFilters);
  document.getElementById("filterRarity").addEventListener("change", applyFilters);
  document.getElementById("filterCategory").addEventListener("change", applyFilters);

  function applyFilters() {
    const q = document.getElementById("search").value.toLowerCase().trim();
    const rarityFilter = document.getElementById("filterRarity").value;
    const catFilter = document.getElementById("filterCategory").value;
    for (const item of data.items) {
      const card = content.querySelector(`[data-iname="${esc(item.internal_name)}"]`);
      if (!card) continue;
      const textMatch = !q || item.name.toLowerCase().includes(q) || item.internal_name.includes(q);
      const rarityMatch = !rarityFilter || item.rarity === rarityFilter || item.rarity.startsWith(rarityFilter + "(");
      const catMatch = !catFilter || (item.categories && item.categories.includes(catFilter));
      card.style.display = (textMatch && rarityMatch && catMatch) ? "" : "none";
    }
    content.querySelectorAll(".rarity-group").forEach(g => {
      const visible = [...g.querySelectorAll(".card")].some(c => c.style.display !== "none");
      g.style.display = visible ? "" : "none";
    });
  }


  function showModal(item) {
    const b = document.getElementById("modalBody");
    let h = `<img src="/images/ror2/items/${item.internal_name}.png" alt="" onerror="this.style.display='none'">`;
    h += `<h2>${esc(item.name)}</h2>`;
    h += `<div class="sub" style="color:${rarityColor[item.rarity] || '#888'}">${esc(baseRarity(item.rarity))}${item.categories?.length ? " · " + esc(item.categories.join(", ")) : ""}</div>`;
    h += `<div class="row" style="margin-bottom:0.5rem"><b>ID:</b> ${esc(item.internal_name)}</div>`;
    const modalStats = Object.entries(item.stats || {});
    if (modalStats.length) {
      h += `<div class="section"><h3>Stats</h3>`;
      for (const [k, v] of modalStats) {
        if (typeof v === "object" && v !== null) {
          const key = k.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
          h += `<div class="content"><b>${esc(key)}:</b> Value: ${esc(v.value || "")} | Stack: ${esc(v.stack || "")} | Add: ${esc(v.add || "")}</div>`;
        } else {
          const key = k.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
          h += `<div class="content"><b>${esc(key)}:</b> ${esc(v)}</div>`;
        }
      }
      h += `</div>`;
    }

    // corruption links
    function corruptLink(iname) {
      const t = data.items.find(i => i.internal_name === iname);
      if (!t) return esc(iname);
      const r = baseRarity(t.rarity);
      const c = rarityColor[r] || "#888";
      return `<span class="corrupt-link" data-iname="${esc(iname)}" style="cursor:pointer;display:inline-flex;align-items:center;vertical-align:middle;gap:0.3rem;color:${c};transition:filter 0.15s" onmouseover="this.style.filter='brightness(1.3)'" onmouseout="this.style.filter=''">`
        + esc(t.name)
        + `<img src="/images/ror2/items/${esc(iname)}.png" alt="" style="width:24px;height:24px;object-fit:contain;border-radius:0.15rem;flex-shrink:0" onerror="this.style.display='none'">`
        + `</span>`;
    }
    if (item.corrupted_iname) h += `<div class="row" style="display:flex;align-items:center;gap:0.3rem"><b>Corrupts to:</b> ${corruptLink(item.corrupted_iname)}</div>`;
    if (item.extra?.corrupt_from) {
      const list = Array.isArray(item.extra.corrupt_from) ? item.extra.corrupt_from : [item.extra.corrupt_from];
      h += `<div class="row" style="display:flex;align-items:center;gap:0.3rem;flex-wrap:wrap"><b>Corrupts from:</b> ${list.map(corruptLink).join(", ")}</div>`;
    }

    if (item.achievement_locked) h += `<div class="section"><h3>Achievement</h3><p>${esc(item.achievement_locked)}</p></div>`;

    for (const [k, v] of Object.entries(item.extra || {})) {
      if (k === "game_name" || k === "corrupt_from") continue;
      if (k === "cooldown" && (!v || v === "0" || v === "0s")) continue;
      if (k === "boss_drop") {
        const enemy = enemyMap[v];
        if (enemy) {
          const c = rarityColor[enemy.type] || "#888";
          h += `<div class="row" style="display:flex;align-items:center;gap:0.3rem;flex-wrap:wrap"><b>Dropped by:</b> <span class="boss-link" data-iname="${esc(v)}" style="cursor:pointer;display:inline-flex;align-items:center;gap:0.3rem;color:${c};transition:filter 0.15s" onmouseover="this.style.filter='brightness(1.3)'" onmouseout="this.style.filter=''">${esc(enemy.name)} <img src="/images/ror2/enemies/${esc(v)}.png" alt="" style="width:20px;height:20px;object-fit:contain;border-radius:0.15rem;flex-shrink:0" onerror="this.style.display='none'"></span></div>`;
          continue;
        }
      }
      h += `<div class="row"><b>${esc(k)}:</b> ${esc(Array.isArray(v) ? v.join(", ") : String(v))}</div>`;
    }

    if (item.lore) h += `<div class="section"><h3>Lore</h3><pre style="background:#40515d;border:1px solid #4e6273;border-radius:0.3rem;padding:0.6rem;font-family:inherit;font-size:0.83rem;line-height:1.45;color:#cbd5e1;white-space:pre-wrap;overflow-x:auto;margin:0">${esc(item.lore)}</pre></div>`;

    b.innerHTML = h;

    // click corruption links to navigate
    b.querySelectorAll(".corrupt-link").forEach(el => {
      el.onclick = e => {
        e.stopPropagation();
        const iname = el.dataset.iname;
        const target = data.items.find(i => i.internal_name === iname);
        if (target) showModal(target);
      };
    });

    // click boss drop links to open enemies page
    b.querySelectorAll(".boss-link").forEach(el => {
      el.onclick = e => {
        e.stopPropagation();
        window.open("/enemies", "_blank");
      };
    });
    document.getElementById("modal").classList.add("open");
  }
})();
</script>
</body>
</html>
